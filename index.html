<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login y Registro</title>
    <link rel="stylesheet" href="/visual.css">
</head>
<body>

<div class="contenedor">
    <h2>Bienvenido</h2>
    <p>Ingresa a tu cuenta para continuar</p>

    <div class="tabs">
        <button type="button" onclick="mostrarFormulario('login')">Iniciar sesión</button>
        <button type="button" onclick="mostrarFormulario('registro')">Crear cuenta</button>
    </div>

    <form id="login" class="formulario" action="login.php" method="post">
        <label for="usuario_login">Usuario o Correo:</label>
        <input type="text" id="usuario_login" name="usuario" required>

        <label for="password_login">Contraseña:</label>
        <input type="password" id="password_login" name="password" required>

        <button type="submit">Ingresar</button>

        <p><a href="#">¿Olvidaste tu contraseña?</a></p>

        <p>
            ¿No tenés cuenta?
            <a href="#" onclick="mostrarFormulario('registro'); return false;">
                Registrate gratis
            </a>
        </p>
    </form>

    <form id="registro"
          class="formulario oculto"
          action="registro.php"
          method="post"
          onsubmit="return validarRegistro()">

        <label for="nombre_apellido">Nombre y Apellido:</label>
        <input type="text"
               id="nombre_apellido"
               name="nombre_apellido"
               required>

        <label for="usuario_registro">Usuario:</label>
        <input type="text"
               id="usuario_registro"
               name="usuario"
               required>

        <p class="error" id="errorUsuario"></p>

        <label for="email_registro">Email:</label>
        <input type="email"
               id="email_registro"
               name="email"
               required>

        <label for="password_registro">Contraseña:</label>
        <input type="password"
               id="password_registro"
               name="password"
               required>

        <p class="error" id="errorPassword"></p>

        <button type="submit">Registrarse</button>
    </form>
</div>

<script>

    function validarUsuario(usuario) {
        let regex = /^[a-zA-Z][a-zA-Z0-9_]{3,14}$/;
        return regex.test(usuario);
    }

    function validarPassword(password) {
        let regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;
        return regex.test(password);
    }

    function validarRegistro() {

        let usuario = document.getElementById("usuario_registro").value.trim();
        let password = document.getElementById("password_registro").value;

        let errorUsuario = document.getElementById("errorUsuario");
        let errorPassword = document.getElementById("errorPassword");

        errorUsuario.textContent = "";
        errorPassword.textContent = "";

        let valido = true;

        if (!validarUsuario(usuario)) {
            errorUsuario.textContent =
                "El usuario debe comenzar con una letra y tener entre 4 y 15 caracteres. Solo se permiten letras, números y _.";
            valido = false;
        }

        if (!validarPassword(password)) {
            errorPassword.textContent =
                "La contraseña debe tener al menos 8 caracteres, una mayúscula, una minúscula, un número y un símbolo.";
            valido = false;
        }

        return valido;
    }

    function mostrarFormulario(id) {
        document.getElementById('login').classList.add('oculto');
        document.getElementById('registro').classList.add('oculto');

        document.getElementById(id).classList.remove('oculto');
    }

</script>

</body>
</html>
