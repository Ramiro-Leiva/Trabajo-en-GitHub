<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login y Registro</title>
  <link rel="stylesheet" href="visual/visual.css">
</head>
<body>

<div class="contenedor">
  <h2>Bienvenido</h2>
  <p>Ingresa a tu cuenta para continuar</p>

  <!-- Botones para alternar -->
  <div class="tabs">
    <button onclick="mostrarFormulario('login')">Iniciar sesión</button>
    <button onclick="mostrarFormulario('registro')">Crear cuenta</button>
  </div>

  <!-- Login -->
  <form id="login" class="formulario" action="login.php" method="post">
    <label for="usuario_login">Usuario o Correo:</label>
    <input type="text" id="usuario_login" name="usuario" required>

    <label for="password_login">Contraseña:</label>
    <input type="password" id="password_login" name="password" required>

    <button type="submit">Ingresar</button>
    <p><a href="#">¿Olvidaste tu contraseña?</a></p>
    <p>¿No tenes cuenta? <a href="#" onclick="mostrarFormulario('registro')">Registrate gratis</a></p>
  </form>

  <!-- Registro -->
  <form id="registro" class="formulario oculto" action="registro.php" method="post">
    <label for="nombre_apellido">Nombre y Apellido:</label>
    <input type="text" id="nombre_apellido" name="nombre_apellido" required>

    <label for="usuario_registro">Usuario:</label>
    <input type="text" id="usuario_registro" name="usuario" required>

    <label for="email_registro">Email:</label>
    <input type="email" id="email_registro" name="email" required>

    <label for="password_registro">Contraseña:</label>
    <input type="password" id="password_registro" name="password" required>

    <button type="submit">Registrarse</button>
  </form>
</div>

<script>

    
  function validarUsuario(usuario_registro) {
    let validar = /^[a-zA-Z][a-zA-Z0-9_]{3,14}$/;
    return validar.test(usuario_registro);
  }

  function validarPassword(password_registro) {
    let validar = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;
    return validar.test(password_registro);
  }

  function mostrarFormulario(id) {
    document.getElementById('login').classList.add('oculto');
    document.getElementById('registro').classList.add('oculto');
    document.getElementById(id).classList.remove('oculto');
  }
</script>

</body>
</html>
